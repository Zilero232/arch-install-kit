# Waypaper: wallpaper picker (Super+W picks a random one). https://github.com/anufrievroman/waypaper
[Settings]
folder = ~/Images
backend = hyprpaper
fill = fill
monitors = All
# Starting picture (same as hyprpaper.conf); waypaper --random only replaces wallpapers it already knows
wallpaper = ~/Images/66.webp
