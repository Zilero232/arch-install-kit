# WirePlumber: Bluetooth headphones stay in music mode (A2DP).
# https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/bluetooth.html
# By default any app that opens a microphone (a browser tab, a call) switches the headset to
# the call profile (HFP): mono, low quality, and AirPods often drop the link on the switch.
# Calls still work: pick the headset profile in pavucontrol, or use the laptop microphone.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
