# MangoHud in-game overlay (Kanagawa colours). https://github.com/flightlessmango/MangoHud#hud-configuration
# Steam launch options: `mangohud gamemoderun %command%`. Toggle in game: Right Shift + F12.

# --- Layout ---
legacy_layout=false
position=top-left
round_corners=10
background_alpha=0.6
font_size=22
table_columns=3
horizontal_stretch=0

# --- What to show ---
fps
frametime
frame_timing=1
gpu_stats
gpu_temp
gpu_power
vram
cpu_stats
cpu_temp
ram
gamemode
vulkan_driver
wine

# --- Colours ---
background_color=16161D
text_color=DCD7BA
gpu_color=7E9CD8
cpu_color=957FB8
vram_color=7AA89F
ram_color=98BB6C
engine_color=D27E99
wine_color=E6C384
frametime_color=7FB4CA
fps_value=30,60
fps_color=C34043,E6C384,98BB6C

# --- Keys ---
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
