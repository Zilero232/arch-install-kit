# lsd (ls replacement). https://github.com/lsd-rs/lsd#config-file-content

classic: false

blocks:
  - permission
  - user
  - group
  - size
  - date
  - name

color:
  when: auto

icons:
  when: auto
  theme: fancy

layout: grid

sorting:
  dir-grouping: first

date: "+%Y-%m-%d %H:%M"

permission: rwx

size: default

indicators: false

header: false

symlink-arrow: ⇒
