# Idle: dim after 5 min, lock after 10 min, screen off after 15 min, suspend after 30 min on battery.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Hyprland's Lua config takes Lua dispatchers: hyprctl dispatch 'hl.dsp.…'

# --- General ---
general {
    # Back to the first layout (us) so the password is not typed in Russian
    lock_cmd = hyprctl switchxkblayout all 0; pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# --- Dim ---
# brightnessctl -s saves the current level, -r restores it on activity
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# --- Lock ---
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# --- Screen off ---
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# --- Suspend on battery ---
# systemd-ac-power exits 0 on AC, so suspend waits while plugged in;
# the retry catches unplugging later in the same idle stretch
listener {
    timeout = 1800
    on-timeout = systemctl suspend
    condition_cmd = ! systemd-ac-power
    condition_retry = 60
}
