# Monitors. https://wiki.hypr.land/Configuring/Monitors/
# Rules apply whenever an output connects, so hotplug needs no script.

# Laptop panel
monitor = eDP-1, 2560x1600@120, 0x0, 1

# External monitor mirrors the laptop while plugged in
monitor = DP-1, 2560x1440@165, 0x0, 1, mirror, eDP-1

# Fallback for any other output
monitor = , preferred, auto, 1
