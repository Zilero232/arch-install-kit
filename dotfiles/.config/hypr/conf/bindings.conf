# Key bindings. https://wiki.hypr.land/Configuring/Binds/
# bindd = MODS, KEY, Description, dispatcher, args — descriptions show in `hyprctl binds`.
# Flags: e = repeat while held, l = works on lock screen, m = mouse.

$mainMod = SUPER

# --- Launchers ---
bindd = $mainMod, Return, Terminal, exec, $terminal
bindd = $mainMod, D, App launcher, exec, $menu
bindd = $mainMod, V, Clipboard history, exec, cliphist list | rofi -dmenu -theme cliphist | cliphist decode | wl-copy
bindd = $mainMod, C, Colour picker, exec, hyprpicker -a

# --- Apps ---
bindd = $mainMod SHIFT, F, Browser, exec, $browser
bindd = $mainMod SHIFT, H, Chrome, exec, $browserAlt
bindd = $mainMod SHIFT CTRL, F, Browser (private), exec, $browser --private-window
bindd = $mainMod SHIFT CTRL, H, Chrome (incognito), exec, $browserAlt --incognito
bindd = $mainMod SHIFT, N, File manager, exec, $fileManager
bindd = $mainMod SHIFT, C, Editor, exec, $editor
bindd = $mainMod SHIFT, P, PhpStorm, exec, phpstorm
bindd = $mainMod SHIFT, T, Telegram, exec, $messenger
bindd = $mainMod SHIFT, Z, Audio mixer, exec, $audioMixer
bindd = $mainMod SHIFT, V, VirtualBox, exec, virtualbox
bindd = $mainMod SHIFT, K, Calendar (calcurse), exec, $terminal -e calcurse

# --- Session ---
bindd = $mainMod, L, Lock screen, exec, pidof hyprlock || hyprlock
bindd = $mainMod, X, Power menu, exec, $scripts/power_menu.sh
bindd = $mainMod SHIFT, Q, Exit Hyprland, exit,

# --- Desktop ---
bindd = $mainMod, P, Toggle Waybar, exec, $scripts/toggle_waybar.sh
bindd = $mainMod, W, Random wallpaper, exec, $scripts/random_wallpaper.sh

# --- Screenshots ---
bindd = $mainMod, S, Screenshot active monitor to clipboard, exec, hyprshot -m output -m active --clipboard-only
bindd = $mainMod SHIFT, S, Screenshot region to ~/Screenshots, exec, hyprshot -m region -o ~/Screenshots

# --- Zoom ---
bindd = $mainMod SHIFT, mouse_down, Zoom in, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl -j getoption cursor:zoom_factor | jq '.float + 0.5')"
bindd = $mainMod SHIFT, mouse_up, Zoom out, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl -j getoption cursor:zoom_factor | jq '[.float - 0.5, 1] | max')"
bindd = $mainMod CTRL, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# --- Windows ---
bindd = $mainMod, Q, Close window, killactive,
bindd = $mainMod, F, Fullscreen, fullscreen, 0
bindd = $mainMod, T, Toggle floating, togglefloating,
bindd = $mainMod, J, Toggle split, layoutmsg, togglesplit
bindd = $mainMod, O, Toggle overlay (chat and mixer), togglespecialworkspace, overlay

bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d

bindd = $mainMod SHIFT, left, Shrink width, resizeactive, -100 0
bindd = $mainMod SHIFT, right, Grow width, resizeactive, 100 0
bindd = $mainMod SHIFT, up, Shrink height, resizeactive, 0 -100
bindd = $mainMod SHIFT, down, Grow height, resizeactive, 0 100

bindmd = $mainMod, mouse:272, Move window, movewindow
bindmd = $mainMod, mouse:273, Resize window, resizewindow

# --- Workspaces ---
bindd = $mainMod, 1, Workspace 1, workspace, 1
bindd = $mainMod, 2, Workspace 2, workspace, 2
bindd = $mainMod, 3, Workspace 3, workspace, 3
bindd = $mainMod, 4, Workspace 4, workspace, 4
bindd = $mainMod, 5, Workspace 5, workspace, 5
bindd = $mainMod, 6, Workspace 6, workspace, 6
bindd = $mainMod, 7, Workspace 7, workspace, 7
bindd = $mainMod, 8, Workspace 8, workspace, 8
bindd = $mainMod, 9, Workspace 9, workspace, 9
bindd = $mainMod, 0, Workspace 10, workspace, 10

bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

# --- Hardware keys ---
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindld = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindeld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl -q s +10%
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl -q s 10%-

bindld = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioPause, Pause, exec, playerctl pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
