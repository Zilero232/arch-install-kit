# Programs started once at login. https://wiki.hypr.land/Configuring/Keywords/#executing

# --- Session services ---
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = hyprsunset
exec-once = hyprctl setcursor Hackneyed-Dark-24px 24
exec-once = $scripts/gtk_theme.sh

# --- Desktop shell ---
exec-once = waybar
exec-once = swaync
exec-once = $scripts/wallpaperengine.sh

# --- Clipboard history ---
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Apps ---
# Telegram is a Qt app, so it scales via QT_SCALE_FACTOR (GDK_SCALE is GTK-only).
exec-once = QT_SCALE_FACTOR=1.2 $messenger -startintray
