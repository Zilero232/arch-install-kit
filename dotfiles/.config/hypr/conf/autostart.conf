# Programs started once at login.

# --- Session services ---
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = hyprsunset
exec-once = hyprctl setcursor Hackneyed-Dark-24px 24

# --- Desktop shell ---
exec-once = waybar
exec-once = swaync
exec-once = $scripts/wallpaperengine.sh
exec-once = ~/.config/hypr/scripts/monitor-auto.sh

# --- Clipboard history ---
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Apps ---
exec-once = GDK_SCALE=1.2 $messenger -startintray
