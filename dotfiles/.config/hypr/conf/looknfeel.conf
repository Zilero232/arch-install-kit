# Gaps, borders, decoration, animations, layout. Values come from hyprtheme.conf.

general {
    layout = dwindle
    gaps_in = $hypr_gaps_in
    gaps_out = $hypr_gaps_out
    border_size = $hypr_border_size
    resize_on_border = true
    col.active_border = $active_border_col_1 $active_border_col_2 $gradient_angle
    col.inactive_border = $inactive_border_col_1
}

decoration {
    rounding = $hypr_rounding
    active_opacity = 1.0
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.5

    blur {
        enabled = true
        size = 16
    }
}

animations {
    enabled = true

    # name, on, speed, curve[, style]
    animation = windowsIn, 1, 1, default
    animation = windowsOut, 1, 4, default, popin
    animation = windowsMove, 1, 6, default, slide

    animation = fadeIn, 1, 6, default
    animation = fadeOut, 1, 6, default
    animation = fadeSwitch, 1, 6, default
    animation = fadeShadow, 1, 6, default
    animation = fadeDim, 1, 6, default

    animation = border, 1, 4, default
    animation = workspaces, 1, 6, default, slide
}

dwindle {
    preserve_split = true
    special_scale_factor = 0.8
}
