# Window rules, grouped by app. https://wiki.hypr.land/Configuring/Window-Rules/

# --- Terminal and file manager: see-through ---
windowrule {
    name = opacity-terminals
    match:class = (Alacritty|thunar)

    opacity = 0.7
}

# --- Chat and mixer: fullscreen on the special "overlay" workspace ---
windowrule {
    name = communication-overlay
    match:class = (Slack|org.telegram.desktop|org.pulseaudio.pavucontrol)

    fullscreen = on
    workspace = special:overlay
}
