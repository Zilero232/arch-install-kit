# Static wallpaper at login; wallpaper.sh (Super+W, Super+Ctrl+W) switches it at runtime.
# ~/Images/66.jpg comes from the kit's assets/images, copied there on install.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/

splash = false
ipc = true

wallpaper {
    monitor =
    path = ~/Images/66.jpg
    fit_mode = cover
}
