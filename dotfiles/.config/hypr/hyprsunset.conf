# Night light: neutral 6500 K from 07:00, a mild 4500 K from 20:00 (3000 K tints everything orange).
# Toggle it any time from the control center (night light button).
# https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/

profile {
    time = 7:00
    temperature = 6500 # not identity: it keeps reporting the old temperature, so the toggle would read "on"
}

profile {
    time = 20:00
    temperature = 4500
}
