# Hyprland entry point. Wiki: https://wiki.hypr.land/Configuring/
# Every concern lives in its own file under conf/; colours live in hyprtheme.conf.

# --- Programs ---
# The single place to swap apps; bindings.conf and autostart.conf use these.
$terminal    = alacritty
$fileManager = thunar
$menu        = rofi -show drun
$browser     = firefox
$browserAlt  = google-chrome-stable
$editor      = cursor
$messenger   = telegram-desktop
$audioMixer  = pavucontrol
$scripts     = ~/bin

# --- Theme ---
source = ~/.config/hypr/hyprtheme.conf

# --- Config ---
source = ~/.config/hypr/conf/envs.conf
source = ~/.config/hypr/conf/monitor.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/looknfeel.conf
source = ~/.config/hypr/conf/misc.conf
source = ~/.config/hypr/conf/bindings.conf
source = ~/.config/hypr/conf/windowrules.conf
