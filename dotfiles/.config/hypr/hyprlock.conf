# Lock screen. https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# `monitor =` left empty means "all monitors".

# --- Colors and font ---
# Kanagawa values copied from ~/.config/theme/kanagawa.css (hyprlang can't import CSS):
# fujiWhite, sakuraPink (the accent-alt role, as on the bar), sumiInk4, samuraiRed, carpYellow.
# rgb() form: a bare # starts a comment in hyprlang.
$text     = rgb(dcd7ba)
$accent   = rgb(d27e99)
$surface0 = rgb(2a2a37)
$red      = rgb(e82424)
$yellow   = rgb(e6c384)
$shadow   = rgb(000000)
$font     = JetBrainsMono Nerd Font

# --- General ---
general {
    ignore_empty_input = true
    hide_cursor = true
}

# --- Background: blurred screenshot ---
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 4
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
}

# --- Password field ---
input-field {
    monitor =
    size = 350, 70
    position = 0, -80
    halign = center
    valign = center

    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1 # circle

    inner_color = $surface0
    outer_color = $accent
    font_color = $text
    font_family = $font
    outline_thickness = 4
    rounding = 10 # the bar's chips; hyprlock has no per-corner radius

    fade_on_empty = false
    fade_timeout = 1000
    hide_input = false

    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    invert_numlock = false
    swap_font_color = false

    shadow_passes = 12
    shadow_size = 25
    shadow_color = $shadow
    shadow_boost = 2.0
}

# --- Keyboard layout under the password field ---
# hypridle switches to the first layout (us) before locking, so the password types as expected
label {
    monitor =
    text = $LAYOUT[EN,RU]
    position = 0, -150
    halign = center
    valign = center

    color = $accent
    font_size = 16
    font_family = $font
}

# --- Clock (top left) ---
label {
    monitor =
    text = $TIME
    position = 30, -30
    halign = left
    valign = top

    color = $text
    font_size = 90
    font_family = $font
    shadow_passes = 10
    shadow_size = 20
}

# --- CPU / RAM / disk (center, every 5 s) ---
label {
    monitor =
    text = cmd[update:5000] echo "CPU: $(LC_ALL=C top -bn2 -d0.5 | grep "Cpu(s)" | tail -1 | awk '{printf "%.0f", 100 - $8}')% | RAM: $(free -m | awk 'NR==2{printf "%.1f%%", $3*100/$2}') | Disk: $(df -h / | awk 'NR==2{print $5}')"
    position = 0, 100
    halign = center
    valign = center

    color = $text
    font_size = 22
    font_family = $font
    shadow_passes = 8
    shadow_size = 15
}

# --- Date (center, every minute so it turns over at midnight) ---
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    position = 0, 20
    halign = center
    valign = center

    color = $text
    font_size = 28
    font_family = $font
    shadow_passes = 8
    shadow_size = 15
}

# --- Username (bottom right) ---
label {
    monitor =
    text = $USER
    position = -30, 30
    halign = right
    valign = bottom

    color = $text
    font_size = 25
    font_family = $font
    shadow_passes = 8
    shadow_size = 15
}
