# Lock screen. https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# `monitor =` left empty means "all monitors".

# --- Colours and font ---
# rgb() form: a bare # starts a comment in hyprlang.
$text     = rgb(cdd6f4)
$accent   = rgb(cba6f7)
$surface0 = rgb(313244)
$red      = rgb(f38ba8)
$yellow   = rgb(f9e2af)
$shadow   = rgb(000000)
$font     = JetBrainsMono Nerd Font

# --- General ---
general {
    ignore_empty_input = true
    hide_cursor = true
}

# --- Background: blurred screenshot ---
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 4
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
}

# --- Password field ---
input-field {
    monitor =
    size = 350, 70
    position = 0, -80
    halign = center
    valign = center

    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1 # circle

    inner_color = $surface0
    outer_color = $accent
    font_color = $text
    font_family = $font
    outline_thickness = 4
    rounding = 20

    fade_on_empty = false
    fade_timeout = 1000
    hide_input = false

    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    invert_numlock = false
    swap_font_color = false

    shadow_passes = 12
    shadow_size = 25
    shadow_color = $shadow
    shadow_boost = 2.0
}

# --- Clock (top left) ---
label {
    monitor =
    text = $TIME
    position = 30, -30
    halign = left
    valign = top

    color = $text
    font_size = 90
    font_family = $font
    shadow_passes = 10
    shadow_size = 20
}

# --- CPU / RAM / disk (centre, every 5 s) ---
label {
    monitor =
    text = cmd[update:5000] echo "CPU: $(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1)% | RAM: $(free -m | awk 'NR==2{printf "%.1f%%", $3*100/$2}') | Disk: $(df -h / | awk 'NR==2{print $5}')"
    position = 0, 100
    halign = center
    valign = center

    color = $text
    font_size = 22
    font_family = $font
    shadow_passes = 8
    shadow_size = 15
}

# --- Date (centre, every 12 h) ---
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    position = 0, 20
    halign = center
    valign = center

    color = $text
    font_size = 28
    font_family = $font
    shadow_passes = 8
    shadow_size = 15
}

# --- Username (bottom right) ---
label {
    monitor =
    text = $USER
    position = -30, 30
    halign = right
    valign = bottom

    color = $text
    font_size = 25
    font_family = $font
    shadow_passes = 8
    shadow_size = 15
}
