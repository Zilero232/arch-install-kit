# MPD for ncmpcpp (user service: systemctl --user enable mpd.socket). https://mpd.readthedocs.io/en/stable/user.html

# Database defaults to ~/.cache/mpd/db (MPD creates the dir); runtime files stay out of ~/.config
music_directory    "~/Music"
playlist_directory "~/Music"
state_file         "~/.cache/mpd/state"
sticker_file       "~/.cache/mpd/sticker.sql"

bind_to_address "127.0.0.1"
port            "6600"
auto_update     "yes"

audio_output {
    type "pipewire"
    name "PipeWire"
}

# Raw PCM for the ncmpcpp visualizer (visualizer_data_source / visualizer_output_name)
audio_output {
    type   "fifo"
    name   "Visualizer feed"
    path   "/tmp/mpd.fifo"
    format "44100:16:2"
}
