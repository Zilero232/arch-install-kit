# GTK 4 settings, same values as gtk-3.0/settings.ini (nwg-look rewrites this file on Apply).

[Settings]
gtk-theme-name=Kanagawa-Orange-Dark
gtk-icon-theme-name=Kanagawa
gtk-font-name=JetBrainsMono Nerd Font 12
gtk-cursor-theme-name=Hackneyed-Dark-24px
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
