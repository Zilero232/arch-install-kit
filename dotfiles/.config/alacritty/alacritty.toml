# Alacritty. https://alacritty.org/config-alacritty.html
# Colours: themes/kanagawa_wave.toml, shortcuts: keybindings.toml

[general]
import = [
    "~/.config/alacritty/themes/kanagawa_wave.toml",
    "~/.config/alacritty/keybindings.toml",
]

[env]
TERM = "alacritty"

[terminal.shell]
program = "/usr/bin/fish"

# --- Window ---
[window]
dynamic_title = true
decorations = "none"

[window.class]
instance = "Alacritty"
general = "Alacritty"

# --- Font ---
[font]
builtin_box_drawing = true
size = 22.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
style = "Bold"

[font.italic]
style = "Italic"

[font.bold_italic]
style = "Bold Italic"

# --- Scrolling and selection ---
[scrolling]
history = 10000
multiplier = 6

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
