# systemd-oomd: kill the cgroup of an app (Chrome, a VM, Android Studio) that keeps the session
# stalled on memory, instead of the whole desktop freezing. Fedora's default.
# https://www.freedesktop.org/software/systemd/man/latest/systemd.resource-control.html#ManagedOOMSwap=
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
